services:
  storage-api-local:
    image: storage-api:local-upload
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage_api_local
    ports:
      - "3998:3999"
    env_file:
      - .env
    environment:
      STORAGE_ROOT_DIR: /var/lib/storage-api
      STORAGE_DIR: /var/lib/storage-api/storage
      APPS_STORAGE_DIR: /var/lib/storage-api/storage/apps
      DATA_DIR: /var/lib/storage-api/data
      DB_DIR: /var/lib/storage-api/db
      TMP_DIR: /var/lib/storage-api/tmp

      # Importante: evita confusão com o serviço original na porta 3999
      BASE_URL: http://localhost:3998
    volumes:
      - storage_api_data:/var/lib/storage-api
    restart: "no"

volumes:
  storage_api_data:
    external: true
    name: storage_api_data